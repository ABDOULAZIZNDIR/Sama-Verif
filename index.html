<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sama Vérif — Prototype</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F3F6FA;--surf:#fff;--ink:#0C2250;--mut:#55647E;--line:#D2DBE8;--brand:#0B2A66;--onb:#fff;--grn:#0E8F3C;--grnb:#E1F4E8;--red:#C8372D;--redb:#FBE6E3;--amb:#FFF1D1;--ambt:#7A4E00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--surf:#0B0F17;--ink:#EEF2F8;--mut:#A3B0C4;--line:#232C3B;--brand:#8DB8FF;--onb:#06122B;--grn:#27B35A;--grnb:#0E2A1A;--red:#FF8B80;--redb:#3A1A17;--amb:#33280D;--ambt:#F5C46B}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--surf:#0B0F17;--ink:#EEF2F8;--mut:#A3B0C4;--line:#232C3B;--brand:#8DB8FF;--onb:#06122B;--grn:#27B35A;--grnb:#0E2A1A;--red:#FF8B80;--redb:#3A1A17;--amb:#33280D;--ambt:#F5C46B}
:root[data-hc="1"]{--bg:#fff;--surf:#fff;--ink:#000;--mut:#000;--line:#000;--brand:#000;--onb:#fff;--grn:#005A24;--grnb:#fff;--red:#8A1500;--redb:#fff;--amb:#fff;--ambt:#6B3F00}
label.btn,label.drop{margin:0;font-size:1rem}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;line-height:1.2}h1{font-size:1.45rem}h2{font-size:1.12rem;margin:1.3rem 0 .6rem}h3{font-size:1rem}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:3px solid #F2A93B;outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;min-height:100%}
.demo{background:var(--amb);color:var(--ambt);font-size:.76rem;text-align:center;padding:.35rem .8rem}
header{display:flex;align-items:center;gap:.5rem;padding:.5rem .9rem;background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.lg{background:#fff;border-radius:10px;padding:2px 8px;display:grid;place-items:center}.lg img{height:34px;display:block}
main{padding:0 1rem 6.5rem}main:focus{outline:none}
.ic{width:1.3rem;height:1.3rem;flex:none}
.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surf);cursor:pointer;display:grid;place-items:center}
.btn{background:var(--brand);color:var(--onb);border:2px solid var(--brand);border-radius:12px;min-height:48px;padding:.6rem 1.1rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn.sec{background:transparent;color:var(--brand)}.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}.btn.red{background:var(--red);border-color:var(--red);color:#000}.btn.full{width:100%}.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.8rem}
.row{display:flex;gap:.7rem;align-items:center}.g{flex:1;min-width:0}
.sub{color:var(--mut);font-size:.88rem;margin:.15rem 0 0}
.pill{display:inline-block;border-radius:99px;padding:.1rem .65rem;font-size:.76rem;font-weight:700;border:1px solid currentColor}
.p-ok{color:var(--grn);background:var(--grnb)}.p-w{color:var(--ambt);background:var(--amb)}.p-i{color:var(--brand)}.p-b{color:var(--red);background:var(--redb)}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0 .4rem;scrollbar-width:none}.chip{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:.4rem .9rem;min-height:40px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:.3rem}.chip[aria-pressed="true"]{background:var(--brand);color:var(--onb);border-color:var(--brand)}
.svc{width:100%;text-align:left;cursor:pointer;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.6rem;display:flex;gap:.8rem;align-items:center;min-height:64px}
.ico{width:44px;height:44px;border-radius:12px;background:var(--bg);color:var(--grn);display:grid;place-items:center;flex:none}
label{display:block;font-size:.86rem;color:var(--mut);margin:.95rem 0 .3rem}
input,select{width:100%;min-height:50px;padding:.55rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.opt{display:block;border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;background:var(--surf);width:100%;text-align:left}.opt b{display:block}.opt span{color:var(--mut);font-size:.88rem}.opt[aria-pressed="true"]{border-color:var(--grn);box-shadow:0 0 0 2px var(--grn) inset}
.bar{height:6px;border-radius:9px;background:var(--line);margin:.7rem 0 .4rem;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn)}
.drop{border:1.5px dashed var(--grn);border-radius:14px;padding:1.3rem 1rem;text-align:center;display:block;cursor:pointer;color:var(--ink);margin-top:.4rem}.drop .ic{width:1.8rem;height:1.8rem;color:var(--grn)}.drop b{display:block;margin:.3rem 0 .1rem}.drop span{font-size:.85rem;color:var(--mut)}
.note{background:var(--amb);color:var(--ambt);border-radius:12px;padding:.7rem .9rem;font-size:.88rem;margin:.8rem 0}.info{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;font-size:.88rem;margin:.8rem 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rec dt{color:var(--mut);font-size:.8rem;margin-top:.6rem}.rec dd{margin:0;font-weight:600}
.tl{list-style:none;margin:.6rem 0 0 .4rem;padding:0 0 0 1.1rem;border-left:3px solid var(--line)}.tl li{position:relative;margin:.65rem 0;font-size:.92rem}.tl li::before{content:"";position:absolute;left:-1.52rem;top:.4rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--grn)}.tl li.b::before{background:var(--red)}.tl li.w::before{background:#F2A93B}.tl li.todo{color:var(--mut)}.tl li.todo::before{background:var(--line)}
table{width:100%;border-collapse:collapse;font-size:.86rem}th{text-align:left;color:var(--mut);font-weight:600;padding:.4rem .3rem;border-bottom:1px solid var(--line)}td{padding:.5rem .3rem;border-bottom:1px solid var(--line);vertical-align:top}.sc{overflow-x:auto}
.cmp td.x{background:var(--redb);color:var(--red);font-weight:700}
ul.l{margin:.3rem 0 0;padding-left:1.1rem}ul.l li{margin:.25rem 0;font-size:.92rem}
.paper{background:#FBFAF4;color:#222;border:1px solid #CFCBB8;border-radius:6px;padding:.9rem;font-family:Georgia,serif;font-size:.85rem}.paper .wm{color:#9C2F17;border:1px solid #9C2F17;font:700 .66rem system-ui;padding:.15rem .4rem;display:inline-block;margin-bottom:.5rem}.paper code{word-break:break-all;font-size:.72rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:.8rem}.stats .card{margin:0}.stats b{font:700 1.6rem Georgia,serif;display:block}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}.bnav div{display:flex;max-width:600px;margin:0 auto}
.bnav button{flex:1;background:none;border:0;padding:.5rem 0;min-height:58px;cursor:pointer;color:var(--mut);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:.15rem}.bnav button[aria-current="page"]{color:var(--brand);font-weight:700}
.fab{position:fixed;right:1rem;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--grn);color:#fff;border:0;display:none;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;z-index:31}
#chat{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;height:78%;background:var(--surf);border:1px solid var(--line);border-radius:22px 22px 0 0;z-index:50;display:none;flex-direction:column}#chat.on{display:flex}#msgs{flex:1;overflow:auto;padding:.9rem}
.m{max-width:85%;padding:.6rem .85rem;border-radius:14px;margin-bottom:.6rem}.m.b{background:var(--bg);border:1px solid var(--line)}.m.u{background:var(--brand);color:var(--onb);margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:12px;display:none;z-index:60;max-width:90vw;font-size:.9rem}
details summary{cursor:pointer;color:var(--brand);font-weight:600;margin-top:.5rem;min-height:36px}
@media (min-width:700px){body{background:var(--line)}.wrap{background:var(--bg)}}
</style></head>

rev:()=>{const x=ANA;return`<button class="chip" data-go="${ROLE==="citoyen"?"ver":"ana"}" style="margin-top:1rem">${ic("back")} Retour</button><h1 style="margin:.8rem 0 .2rem">Relecture des champs</h1><p class="sub">Corrigez ce qui a été mal lu, puis lancez les contrôles.</p><p class="note">Lecture automatique simulée sur un acte fictif. Règles de démonstration, à valider par un agent d’état civil.</p><div class="card">${FK.map(f=>{const c=x.c[f];return`<label for="a_${f}" style="color:var(--ink)">${FL[f]} <span class="pill ${c>=CFG.confMin?"p-ok":"p-w"}">${Math.round(c*100)} %</span></label><input id="a_${f}" value="${esc(x.v[f])}">`}).join("")}<button class="btn full" id="runbtn" style="margin-top:1rem">Lancer les contrôles</button></div>`},

${ROLE==="citoyen"?`<p class="info">Ce résultat est une aide. Seul l’agent habilité décide.</p><button class="btn full" data-go="ver">Nouvelle vérification</button>`:`<div class="card"><h3>Votre décision</h3><p class="sub">L’outil n’approuve ni ne rejette un document. Vous restez responsable.</p><div class="chips">${["Validé","À approfondir","Suspect"].map(k=>`<button class="chip" data-dec="${k}" aria-pressed="false">${k}</button>`).join("")}</div><label for="com">Commentaire (facultatif)</label><input id="com"><button class="btn grn full" id="sv" style="margin-top:1rem" disabled>Enregistrer et voir le rapport</button></div>`}`},
rep:()=>{const h=ANA;return`<h1 style="margin:1.1rem 0 .2rem">Rapport d’analyse</h1><p class="sub">${h.id||"Brouillon"} · ${h.date||today()} · ${SAM.find(x=>x.id===h.titre).n}</p><p class="note">Analyse indicative. Ce rapport est une aide à la vérification : il ne prouve ni l’authenticité ni la fraude. La décision appartient à l’agent habilité.</p><div class="card"><span class="pill ${LV[h.res.niveau][0]}">${LV[h.res.niveau][1]}</span><p><b>Décision :</b> ${esc(h.dec||"non enregistrée")}${h.com?" — "+esc(h.com):""}</p></div><div class="card"><h3>Champs analysés</h3><table>${FK.map(f=>`<tr><td>${FL[f]}</td><td>${esc(h.v[f])||"—"}</td></tr>`).join("")}</table></div><div class="card"><h3>Alertes et contrôles</h3><table>${h.res.R.map(x=>`<tr><td>${x.id}</td><td><b>${x.n}</b><br>${esc(x.m)}</td></tr>`).join("")}</table></div><p class="sub">Limites : règles de démonstration à valider par un agent d’état civil ; aucun registre officiel consulté ; données fictives.</p><button class="btn full" id="prt" style="margin-top:.8rem">Imprimer</button><button class="btn sec full" data-go="ana" style="margin-top:.6rem">Retour</button>`},
set:()=>`<h1 style="margin:1.1rem 0 .3rem">Réglages</h1><p class="sub">Ces seuils pilotent réellement les contrôles. Chaque modification est journalisée.</p><div class="card"><h3>Lecture des documents</h3><label for="s_ocr">Fiabilité de lecture minimale (%)</label><input id="s_ocr" type="number" min="1" max="100" value="${Math.round(CFG.confMin*100)}"></div><div class="card"><h3>Détection</h3><label for="s_bf">Force brute : échecs depuis une même adresse</label><input id="s_bf" type="number" min="2" value="${CY.bf}"><label for="s_bu">Rafale : consultations de registres</label><input id="s_bu" type="number" min="2" value="${CY.bu}"><label for="s_dl">Téléchargements groupés</label><input id="s_dl" type="number" min="2" value="${CY.dl}"></div><button class="btn full" id="apply">Appliquer</button><p class="info">Essayez de relever les seuils de rafale à 11 et de téléchargements à 4, puis ouvrez la supervision (profil cybersécurité) : ces alertes disparaissent, mais l’incident reste car d’autres règles le corroborent. C’est le compromis entre fausses alertes et attaques manquées.</p>`,
aud:()=>`<h1 style="margin:1.1rem 0 .3rem">Intégrité et traçabilité</h1><p class="sub">Calculs SHA-256 réels dans votre navigateur ; rien n’est envoyé.</p><div class="card"><h3>Journal d’audit chaîné</h3><p class="sub">Chaque entrée porte une empreinte calculée avec celle de l’entrée précédente. Modifier une ancienne entrée rompt la chaîne à partir de ce point.</p><div class="sc"><table><tr><th>N°</th><th>Heure</th><th>Acteur</th><th>Action</th><th>Empreinte</th></tr>${AUD.map((e,i)=>`<tr style="${BRK>=0&&i>=BRK?"background:var(--redb)":""}"><td>${i+1}</td><td>${e[0]}</td><td>${esc(e[1])}</td><td>${esc(e[2])}</td><td style="font-family:monospace;font-size:.72rem">${CH[i]?CH[i].slice(0,12)+"…":"—"}</td></tr>`).join("")}</table></div><div style="display:grid;gap:.5rem;margin-top:.8rem"><button class="btn" id="vchain">Vérifier la chaîne</button><button class="btn sec" id="tamper">Simuler une modification</button><button class="btn sec" id="restore">Rétablir</button></div><div id="vres" role="status" style="margin-top:.6rem"></div><p class="info">Limite : une chaîne ne protège pas contre quelqu’un qui recalculerait toutes les empreintes. En production, ancrer l’empreinte finale sur un support externe en écriture seule.</p></div><div class="card"><h3>Empreinte d’un fichier</h3><p class="sub">Choisissez un fichier pour calculer son SHA-256, puis comparez-le à une empreinte de référence. Le fichier reste sur votre appareil. Une empreinte ne prouve pas seule l’authenticité.</p><label for="hf">Fichier</label><input id="hf" type="file"><label for="hexp">Empreinte de référence (facultatif)</label><input id="hexp" autocomplete="off" spellcheck="false"><div id="hfres" role="status" style="margin-top:.6rem"></div></div>`,

 if(STEP===0)b=`<h2>Qui effectue cette demande ?</h2><p class="sub">Sélectionnez votre situation.</p><div style="margin-top:.7rem">${[["self","Je demande mon propre extrait","La personne concernée est moi-même."],["child","Je demande pour mon enfant ou une personne dont j’ai la charge","Je suis parent, tuteur ou membre de la famille."],["adult","Je fais une demande pour un autre adulte","Je dispose d’une autorisation ou d’un justificatif."]].map(([k,t,s])=>`<button class="opt" data-who="${k}" aria-pressed="${f.who===k}"><b>${t}</b><span>${s}</span></button>`).join("")}</div>${f.who?`<label for="dem_nom">${f.who==="self"?"Votre nom et prénom(s)":"Nom et prénom(s) du demandeur"}</label><input id="dem_nom" value="${esc(f.dem_nom)}" autocomplete="name"><label for="dem_tel">Téléphone</label><input id="dem_tel" type="tel" inputmode="tel" value="${esc(f.dem_tel)}" autocomplete="tel">`:""}${f.who&&f.who!=="self"?`<label for="rel">Lien avec la personne concernée</label><select id="rel"><option value="">Choisir</option>${(f.who==="child"?["Père","Mère","Tuteur légal","Autre membre de la famille"]:["Conjoint(e)","Parent","Mandataire","Autre"]).map(x=>`<option ${f.rel===x?"selected":""}>${x}</option>`).join("")}</select>${nr?`<p class="note">Un justificatif de représentation ou une autorisation sera demandé à l’étape des pièces. Un membre de la famille n’est pas automatiquement habilité.</p>`:""}`:""}`;
 if(STEP===1)b=`<h2>${f.who==="self"?"Vos informations de naissance":"Informations de la personne concernée"}</h2><label for="num">Numéro d’acte</label><input id="num" inputmode="numeric" placeholder="Saisir le numéro d’acte" value="${esc(f.num)}"><label for="annee">Année d’enregistrement</label><input id="annee" inputmode="numeric" maxlength="4" value="${esc(f.annee)}"><p class="sub" style="margin-top:.4rem">Facultatif. Ce n’est pas la référence de votre demande Sama Vérif.</p><label for="nom">Nom</label><input id="nom" value="${esc(f.nom)}"><label for="prenom">Prénom(s)</label><input id="prenom" value="${esc(f.prenom)}"><label for="naiss">Date de naissance</label><input id="naiss" type="date" value="${esc(f.naiss)}"><label for="lieu">Lieu de naissance</label><input id="lieu" value="${esc(f.lieu)}"><label for="pere">Prénom du père (facultatif)</label><input id="pere" value="${esc(f.pere)}"><label for="mere">Prénom de la mère (facultatif)</label><input id="mere" value="${esc(f.mere)}"><p class="sub" style="margin-top:.4rem">Les informations sur les parents aident à retrouver l’acte.</p>`;
 if(STEP===2)b=`<h2>Dans quel centre d’état civil votre acte a-t-il été enregistré ?</h2><p class="sub">Ce n’est pas forcément votre lieu de résidence actuel.</p><label for="ctrs">Rechercher un centre</label><input id="ctrs" list="ctrl" placeholder="Rechercher une mairie ou un centre…" autocomplete="off"><datalist id="ctrl">${CT.map(c=>`<option value="${esc(c[0])}">`).join("")}</datalist><label style="display:flex;gap:.6rem;color:var(--ink);margin-top:1rem"><input type="checkbox" id="unk" style="width:1.3rem;min-height:1.3rem;flex:none" ${f.unk?"checked":""}><span>Je ne connais pas précisément le centre d’état civil</span></label>
